plugins {
	id 'net.fabricmc.fabric-loom' apply false
	id 'net.fabricmc.fabric-loom-remap' apply false
}

def remapped = providers.gradleProperty('remapped').isPresent()
apply plugin: remapped ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

if (providers.gradleProperty('split').isPresent()) {
	loom.splitEnvironmentSourceSets()
}

dependencies {
	minecraft(remapped ? 'com.mojang:minecraft:1.20.4' : 'com.mojang:minecraft:26.1.2')

	if (remapped) {
		mappings loom.officialMojangMappings()
	}

	add(providers.gradleProperty('dependencyScope').getOrElse('implementation'), project(':producer'))
	implementation project(':plain')
}
